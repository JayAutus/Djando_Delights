<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Django Delights{% endblock %}</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <a href="/" class="nav-brand">Django Delights</a>
            {% if user.is_authenticated %}
            <ul class="nav-menu">
                <li><a href="/">Home</a></li>
                <li><a href="/ingredients/">Ingredients</a></li>
                <li><a href="/menu/">Menu</a></li>
                <li><a href="/purchases/">Purchases</a></li>
                <li><a href="/accounts/logout/">Logout ({{ user.username }})</a></li>
            </ul>
            {% endif %}
        </div>
    </nav>
    
    <div class="container">
        {% block content %}
        {% endblock %}
    </div>
</body>
</html>
